apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: acid-minimal-cluster
spec:
  teamId: "acid"
  volume:
    size: 1Gi
  numberOfInstances: 3
  users:
   appuser: []
    # database owner
   zalando:
    - superuser
    - createdb

    # role for application foo
   foo_user: # or 'foo_user: []'

  #databases: name->owner
  databases:
    appdb: zalando
  postgresql:
    version: "18"
  enableLogicalBackup: true
