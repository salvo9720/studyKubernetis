apiVersion: batch/v1
kind: CronJob
metadata:
  name: mio-cronjob
spec:
  schedule: "*/2 * * * *" # ogni 2 minuti
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: mio-task
            image: busybox:1.28
            command:
            - /bin/sh
            - -c
            - date; echo Hello from the Kubernetes cluster
          restartPolicy: OnFailure
