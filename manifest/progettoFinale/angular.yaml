apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular-fe
  template:
    metadata:
      labels:
        app: angular-fe
    spec:
      containers:
      - name: angular-fe
        image: node:20.19.0
        command:
          - sh
          - -c
        args:
          - npm ci &&
            echo "installaing playwright " &&
            npx playwright install --with-deps &&
            echo "container starting" &&
            npm run startDockerContainer 
          
        workingDir: /app
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        ports:
        - containerPort: 4200

        livenessProbe:
          httpGet:
            path: /
            port: 4200
          initialDelaySeconds: 800
          periodSeconds: 15

--- 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: angular-hpa

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: angular-fe

  minReplicas: 1
  maxReplicas: 5

  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---
apiVersion: v1
kind: Service
metadata:
  name: angular-service
spec:
  type: ClusterIP
  selector:
    app: angular-fe
  ports:
  - port: 4200
    targetPort: 4200

--- 
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angular-ingress
  labels:
    app.kubernetes.io/name: angular-ingress
spec:
  rules:
  - host: localhost
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: angular-service
            port: 
              number: 4200


