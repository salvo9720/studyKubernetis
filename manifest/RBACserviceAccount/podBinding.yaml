apiVersion: v1
kind: Pod

metadata:
  name: test-reader
  namespace: dev

spec:
  serviceAccountName: reader-sa

  containers:
    - name: kubectl
      image: bitnami/kubectl

      command:
        - sleep
        - "3600"

      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"